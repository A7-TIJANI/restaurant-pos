spring.application.name=epicit-pos

# Local only: bind to loopback, let the OS pick a free port (written to port.txt at startup)
server.address=127.0.0.1
server.port=0

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Instants are stored in UTC; report boundaries are computed in Africa/Kigali in code
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Own cookie name: browsers share cookies across ports on 127.0.0.1, so a default JSESSIONID from any other
# local dev server could otherwise collide with the owner session. HttpOnly + SameSite keep it out of scripts/cross-site.
server.servlet.session.cookie.name=EPICIT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Set to false in tests so no browser is launched
epicit.open-browser=true

# spring.datasource.url and epicit.data-dir are set by EpicItPosApplication.main()
# (data lives in %LOCALAPPDATA%\EpicIT POS on the laptop)
