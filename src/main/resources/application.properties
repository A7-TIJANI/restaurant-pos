spring.application.name=epicit-pos

# Local only: bind to loopback, let the OS pick a free port (written to port.txt at startup)
server.address=127.0.0.1
server.port=0

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Instants are stored in UTC; report boundaries are computed in Africa/Kigali in code
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Set to false in tests so no browser is launched
epicit.open-browser=true

# spring.datasource.url and epicit.data-dir are set by EpicItPosApplication.main()
# (data lives in %LOCALAPPDATA%\EpicIT POS on the laptop)
