<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${restaurantName} + ' POS'">Epic IT POS</title>
    <link rel="stylesheet" th:href="@{/css/pos.css}">
</head>
<body th:attr="data-restaurant=${restaurantName}">

<div id="toast-stack"></div>
<div id="modal-root"></div>

<div class="admin-panel">

    <!-- A14: shown (by pos.js) while the PIN was reset via RESET-PIN and no new PIN has been set yet -->
    <div id="reset-banner" class="reset-banner" hidden>
        <span id="reset-text"></span>
        <button type="button" id="reset-setup-btn">Set PIN</button>
    </div>

    <div class="header-box">
        <h2 style="margin:0;" th:text="${restaurantName}">Restaurant</h2>
        <div class="header-right">
            <div id="clock" class="clock"></div>
            <button type="button" id="reports-btn" class="owner-btn" hidden>Reports</button>
            <button type="button" id="owner-btn" class="owner-btn">Owner</button>
        </div>
    </div>

    <!-- A16: cashier-visible counter strip (today's finalized orders; refreshed on every finalize) -->
    <div class="counter-strip" id="counter-strip">
        <div class="pay-badge">Orders today<b id="strip-count" th:text="${today.orders()}">0</b></div>
        <div class="pay-badge">Total<b id="strip-total"
                th:text="${#numbers.formatInteger(today.revenue(), 1, 'COMMA')} + ' RWF'">0 RWF</b></div>
        <div class="pay-badge">Cash<b id="strip-cash"
                th:text="${#numbers.formatInteger(today.cash(), 1, 'COMMA')} + ' RWF'">0 RWF</b></div>
        <div class="pay-badge">MoMo<b id="strip-momo"
                th:text="${#numbers.formatInteger(today.momo(), 1, 'COMMA')} + ' RWF'">0 RWF</b></div>
    </div>

    <div class="section-title">Top 5 Best Sellers</div>
    <div id="top5-container" class="top5-grid">
        <div class="top5-card" th:each="t, st : ${top5}" th:classappend="'rank-' + ${st.count}">
            <div class="t5-label" th:text="${t.name()}">Item</div>
            <div class="t5-val" th:text="${t.qty()}">0</div>
        </div>
        <div class="top5-empty" th:if="${#lists.isEmpty(top5)}">No sales data yet — start selling!</div>
    </div>

    <div class="section-title">1. Quick Add-ons <span class="hint">(tap an order line below first)</span></div>
    <div id="addon-bar" class="addon-bar">
        <div class="addon-tag" th:each="addon : ${addons}" th:attr="data-addon-id=${addon.id}"
             th:text="'+ ' + ${addon.name}">+ Onion</div>
    </div>

    <div class="pay-bar">
        <button class="pay-btn active" id="pay-cash" data-method="CASH" type="button">Cash</button>
        <button class="pay-btn" id="pay-momo" data-method="MOMO" type="button">MoMo</button>
    </div>

    <div class="section-title">2. Menu</div>
    <div id="menu-container" class="menu-grid">
        <div class="menu-card"
             th:each="item : ${menu}"
             th:classappend="${item.outOfStock ? 'out-of-stock' : ''} + ' ' + ${item.lowStock ? 'low-stock' : ''}"
             th:style="'background-color:' + ${item.color}"
             th:attr="data-item-id=${item.id}">
            <b th:text="${item.name}">Item</b>
            <span class="price-tag" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA')} + ' RWF'">0 RWF</span>
            <div class="stock-row">
                <span class="stock-text" th:text="${item.stock} + ' left'">0 left</span>
            </div>
        </div>
    </div>

    <button class="btn-print" id="print-btn" type="button" disabled>PRINT INVOICE</button>

    <div class="section-title cart-title">
        <span>Current Order <span id="cart-order-no"></span></span>
        <button class="btn-cancel" id="cancel-btn" type="button" hidden>Cancel order</button>
    </div>
    <div id="cart-items-list">
        <div class="cart-empty">No items yet — tap a menu item to add it.</div>
    </div>

    <div class="section-title">Today's Orders</div>
    <div id="orders-list" class="orders-list">
        <div class="cart-empty">No orders yet today.</div>
    </div>
</div>

<div class="preview-area">
    <!-- Filled by pos.js from the current order (same builders as the print targets) -->
    <div id="invoice-wrap" class="thermal-invoice"></div>
</div>

<!-- Print targets: only the one marked .active is visible while printing (same approach as v1) -->
<div id="print-customer" class="print-target"></div>
<div id="print-kitchen" class="print-target"></div>
<div id="print-report" class="print-target"></div>

<script th:src="@{/js/pos.js}"></script>
</body>
</html>
